<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Screenshot mockup — panel</title>
<link rel="stylesheet" href="../overlay.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #444444;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Exact screenshot canvas. The real panel uses position:fixed (relative to
     the actual browser viewport), which only lines up with this frame when
     the viewport IS exactly 1280x800 — not guaranteed in every capture
     environment. #igsc-panel is overridden to position:absolute below so it
     docks to THIS frame regardless of the real viewport size. */
  .frame {
    position: relative;
    width: 1280px;
    height: 800px;
    margin: 0 auto;
    overflow: hidden;
    background: #000000;
  }

  #igsc-panel {
    position: absolute !important;
  }

  .demo-topbar {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 28px;
    color: #f5f5f5;
    font-size: 18px;
    font-weight: 600;
    border-bottom: 1px solid #262626;
  }

  .demo-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    padding: 4px;
  }

  .demo-tile {
    aspect-ratio: 1 / 1;
    border-radius: 2px;
  }

  /* Generic placeholder "photo" tiles — flat gradients, no real images or
     third-party content, just enough visual texture to read as a grid of
     saved posts. */
  .demo-tile:nth-child(6n+1) { background: linear-gradient(135deg, #3a3a3a, #1c1c1c); }
  .demo-tile:nth-child(6n+2) { background: linear-gradient(135deg, #2f6fed, #1c3f8a); }
  .demo-tile:nth-child(6n+3) { background: linear-gradient(135deg, #4a4a4a, #262626); }
  .demo-tile:nth-child(6n+4) { background: linear-gradient(135deg, #00c2a8, #06746a); }
  .demo-tile:nth-child(6n+5) { background: linear-gradient(135deg, #545454, #2b2b2b); }
  .demo-tile:nth-child(6n+6) { background: linear-gradient(135deg, #6a6a6a, #333333); }

  .demo-caption {
    position: absolute;
    left: 20px;
    bottom: 16px;
    color: #6a6a6a;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="demo-topbar">Saved</div>
  <div class="demo-grid" id="grid"></div>
  <div class="demo-caption">Illustrative preview — the panel appears on your own Instagram Saved page</div>

  <div id="igsc-panel">
    <div class="igsc-header">
      <span>Saved Post Cleaner</span>
      <span class="igsc-header-actions">
        <button id="igsc-settings" class="igsc-reset-btn" title="Open settings">Settings</button>
        <button id="igsc-reset" class="igsc-reset-btn" title="Reset saved stats and skip log">Reset</button>
      </span>
    </div>
    <div class="igsc-status" id="igsc-status">Running…</div>
    <div class="igsc-counts">
      <span>Unsaved: <b id="igsc-count-unsaved">128</b></span>
      <span>Skipped: <b id="igsc-count-skipped">3</b></span>
    </div>
    <div class="igsc-buttons">
      <button id="igsc-start" disabled>Start</button>
      <button id="igsc-stop">Stop</button>
    </div>
    <div class="igsc-log" id="igsc-log">
      <div>Skipped: Could not confidently identify the unsave control</div>
      <div>Skipped: Post did not open in time</div>
    </div>
  </div>
</div>

<script>
  // Fill a 6x5 grid of generic placeholder tiles as a stand-in for a saved-posts grid.
  const grid = document.getElementById('grid');
  for (let i = 0; i < 30; i++) {
    const tile = document.createElement('div');
    tile.className = 'demo-tile';
    grid.appendChild(tile);
  }
</script>

</body>
</html>
