<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marquee promo tile 1400x560</title>
<link rel="stylesheet" href="../../../src/overlay.css" />
<link rel="stylesheet" href="shared.css" />
<style>
  .stage { width: 1400px; height: 560px; }
  .copy { left: 90px; width: 600px; }
  .copy h1 { font-size: 60px; }
  .tiles {
    position: absolute; left: 760px; top: -40px; width: 700px;
    transform: rotate(-8deg); opacity: 0.55;
  }
  .tiles .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0; }
  .tiles .tile { border-radius: 10px; }
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <div class="brand"><img src="../../../icons/icon128.png" alt="" />Saved Post Cleaner</div>
    <h1>Unsave your Instagram <em>saved posts</em> in bulk</h1>
    <p>One click from any tab · Safe pacing · 32 languages</p>
  </div>

  <div class="tiles"><div class="grid" data-tiles="16" data-removing="1,2,3"></div></div>

  <div class="panel-wrap" style="left:880px; top:150px;">
    <div class="panel-zoom" style="zoom:1.45">
      <div id="igsc-panel" role="region" aria-label="Saved Post Cleaner">
        <div class="igsc-header">
          <span class="igsc-title">Saved Post Cleaner<b id="igsc-min-count"></b></span>
          <span class="igsc-header-actions">
            <button class="igsc-reset-btn">Settings</button>
            <button class="igsc-reset-btn">Reset</button>
            <button class="igsc-reset-btn igsc-icon-btn">–</button>
            <button class="igsc-reset-btn igsc-icon-btn">✕</button>
          </span>
        </div>
        <div class="igsc-status">Running…</div>
        <div class="igsc-counts">
          <span>Unsaved: <b>243</b></span>
          <span>Skipped: <b>2</b></span>
        </div>
        <div class="igsc-buttons">
          <button id="igsc-start" disabled>Start</button>
          <button id="igsc-stop">Stop</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="grid.js"></script>
</body>
</html>
