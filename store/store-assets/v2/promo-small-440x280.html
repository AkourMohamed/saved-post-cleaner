<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Small promo tile 440x280</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .tile-stage {
    position: relative;
    width: 440px;
    height: 280px;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(320px 240px at 0% 0%, rgba(47, 111, 237, 0.55), transparent 70%),
      radial-gradient(320px 260px at 100% 100%, rgba(0, 194, 168, 0.45), transparent 70%),
      #0a0f1a;
    padding: 34px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .head { display: flex; align-items: center; gap: 14px; }
  .head img { width: 58px; height: 58px; }
  .name { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -0.3px; }
  .tag { font-size: 21px; line-height: 1.3; font-weight: 600; color: #e8eef6; }
  .tag em {
    font-style: normal;
    background: linear-gradient(90deg, #6ea0ff, #2fe0c4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .foot { display: flex; gap: 8px; }
  .foot span {
    font-size: 13px; padding: 5px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); color: #d6e0ec;
  }
</style>
</head>
<body>
<div class="tile-stage">
  <div class="head">
    <img src="../../../icons/icon128.png" alt="" />
    <div class="name">Saved Post<br />Cleaner</div>
  </div>
  <div class="tag">Unsave Instagram <em>saved posts</em> in bulk</div>
  <div class="foot"><span>One click</span><span>Safe pacing</span><span>32 languages</span></div>
</div>
</body>
</html>
